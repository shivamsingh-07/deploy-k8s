---
- name: Prepare all nodes
  hosts: all
  become: true
  vars:
    kube_user: vagrant
    cri_o_keyring: /etc/apt/keyrings/cri-o-apt-keyring.gpg
    k8s_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg2
        state: present
        update_cache: true

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      when: ansible_facts['swaptotal_mb'] | default(0) > 0

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*[^#][^\s]+\s+[^\s]+\s+swap\s+'
        state: absent
      when: ansible_facts['swaptotal_mb'] | default(0) > 0

    - name: Download CRI-O repository key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/addons:/cri-o:/prerelease:/main/deb/Release.key
        dest: /tmp/cri-o-release.key
        mode: "0644"

    - name: Install CRI-O GPG key
      ansible.builtin.shell: gpg --dearmor --batch --yes -o {{ cri_o_keyring }} /tmp/cri-o-release.key
      args:
        creates: "{{ cri_o_keyring }}"

    - name: Add CRI-O apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ cri_o_keyring }}] https://pkgs.k8s.io/addons:/cri-o:/prerelease:/main/deb/ /"
        state: present
        filename: cri-o

    - name: Install CRI-O
      ansible.builtin.apt:
        name: cri-o
        state: present

    - name: Enable and start CRI-O
      ansible.builtin.systemd:
        name: crio
        state: started
        enabled: true
        daemon_reload: true

    - name: Download Kubernetes repository key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ K8S_VERSION }}/deb/Release.key"
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Install Kubernetes GPG key
      ansible.builtin.shell: gpg --dearmor --batch --yes -o {{ k8s_keyring }} /tmp/kubernetes-release.key
      args:
        creates: "{{ k8s_keyring }}"

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ k8s_keyring }}] https://pkgs.k8s.io/core:/stable:/v{{ K8S_VERSION }}/deb/ /"
        state: present
        filename: kubernetes

    - name: Install kubernetes binaries
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Ensure kernel modules config
      ansible.builtin.blockinfile:
        path: /etc/modules-load.d/k8s.conf
        block: |
          overlay
          br_netfilter
        create: true

    - name: Load kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure sysctl settings for Kubernetes
      ansible.builtin.blockinfile:
        path: /etc/sysctl.d/k8s.conf
        block: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        create: true

    - name: Apply kernel settings
      ansible.builtin.command: sysctl --system

    - name: Set kubelet node IP
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        line: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}"
        create: true

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: true

- name: Configure control-plane
  hosts: control-plane
  become: true
  vars:
    kube_user: vagrant
    pod_network_cidr: 172.16.0.0/16

  tasks:
    - name: Pull kubeadm images
      ansible.builtin.command: kubeadm config images pull

    - name: Install Helm
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Initialize control-plane
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ node_ip }}
        --apiserver-cert-extra-sans={{ node_ip }}
        --node-name={{ inventory_hostname }}
        --skip-phases=addon/kube-proxy
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kube config directory
      ansible.builtin.file:
        path: /home/{{ kube_user }}/.kube
        state: directory
        mode: "0755"
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"

    - name: Copy admin kubeconfig for {{ kube_user }}
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ kube_user }}/.kube/config
        remote_src: true
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0644"

    - name: Rename kubeconfig context
      ansible.builtin.command: >
        kubectl config rename-context
        kubernetes-admin@kubernetes
        vagrant-cluster
      environment:
        KUBECONFIG: "/home/{{ kube_user }}/.kube/config"

    - name: Add Cilium Helm repo
      ansible.builtin.command:
        cmd: helm repo add cilium https://helm.cilium.io/
      register: cilium_helm_repo
      failed_when: >-
        cilium_helm_repo.rc != 0
        and 'already exists' not in (cilium_helm_repo.stderr | default(''))
      changed_when: cilium_helm_repo.rc == 0

    - name: Add Metrics Server Helm repo
      ansible.builtin.command:
        cmd: helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
      register: metrics_helm_repo
      failed_when: >-
        metrics_helm_repo.rc != 0
        and 'already exists' not in (metrics_helm_repo.stderr | default(''))
      changed_when: metrics_helm_repo.rc == 0

    - name: Update Helm repo cache
      ansible.builtin.command: helm repo update

    - name: Install Cilium CNI
      ansible.builtin.command: >
        helm upgrade --install cilium cilium/cilium
        --namespace kube-system
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ node_ip }}
        --set k8sServicePort=6443
        --set ipam.operator.clusterPoolIPv4PodCIDRList={{ pod_network_cidr }}
      environment:
        KUBECONFIG: "/home/{{ kube_user }}/.kube/config"

    - name: Install Metrics Server
      ansible.builtin.command: >
        helm upgrade --install metrics-server metrics-server/metrics-server
        --namespace kube-system
        --set args="{--kubelet-insecure-tls,--kubelet-preferred-address-types=InternalIP}"
      environment:
        KUBECONFIG: "/home/{{ kube_user }}/.kube/config"

    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Copy join command to controller
      ansible.builtin.copy:
        content: "{{ join_command.stdout }}"
        dest: /{{ kube_user }}/join-command

    - name: Fetch kubeconfig to controller
      ansible.builtin.fetch:
        src: /home/{{ kube_user }}/.kube/config
        dest: config.yaml
        flat: true

- name: Configure workers
  hosts: worker
  become: true
  vars:
    kube_user: vagrant

  tasks:
    - name: Join worker to cluster
      ansible.builtin.command: sh /{{ kube_user }}/join-command
      args:
        creates: /etc/kubernetes/kubelet.conf

    - name: Create kube config directory
      ansible.builtin.file:
        path: /home/{{ kube_user }}/.kube
        state: directory
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0755"

    - name: Copy kubeconfig to worker
      ansible.builtin.copy:
        src: config.yaml
        dest: /home/{{ kube_user }}/.kube/config
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0644"

    - name: Label node as worker
      ansible.builtin.command: kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/worker=worker
      become: false
